method: bayes
name: 03_tuning_cifar10_bresnet_scfe
metric:
  goal: maximize
  name: validation/accuracy
parameters:
  tuning:
    value: true
  data.name:
    value: cifar10
  trainer.max_epochs:
    value: 200
  model.model_type:
    value: BPreActResNet
  loss.type:
    value: scfe_regularization
  loss.alpha:
    distribution: uniform
    min: -1.0
    max: -0.01
  estimator.type:
    value: scfe
  estimator.reg_coef.value:
    distribution: uniform
    min: 0.1
    max: 2.3
