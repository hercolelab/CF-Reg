method: grid
name: 5_Phoneme_LogReg_SCFE_EpsilonVCP # 5_Phoneme_LogReg_SCFE_TPTN # 
metric:
  goal: maximize
  name: validation/accuracy
parameters:
  seed:
    values:
      - 42
      - 43
      - 44
      - 45
      - 46
  loss:
    values:
      - {type: scfe_regularization, alpha: -0.6498512787189685}
  loss.aggr_func:
    values:
      - {type: montecarlo_vcp_weighted_mean} # - {type: tp_tn_mean} # 
  estimator.reg_coef:
    values:
      - {rc_type: 'by_value', value: 1.0577278144077804}
  model:
    values:
      - {model_type: LogisticRegression}
  preprocessor:
    values:
      - {poly_features_degree: 11, resample: 1}