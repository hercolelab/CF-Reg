method: bayes
name: CIFAR10_ResNet_SCFE_EpsilonVCP # CIFAR10_ResNet_SCFE_TPTN #
metric:
  goal: maximize
  name: validation/accuracy
parameters:
  loss.aggr_func.type:  # `aggr_func` nested under `loss`
    values:
      - montecarlo_vcp_weighted_mean # - tp_tn_mean # 
  loss.alpha:  # `alpha` nested under `loss`
    distribution: uniform
    min: -1.0
    max: -0.0000001
  estimator.reg_coef.value:  # `reg_coef` nested under `estimator`
    distribution: uniform
    min: 0.00001
    max: 0.8
  model:
    values:
      - {model_type: BPreActResNet}
  preprocessor:
    values:
      - {poly_features_degree: 1, resample: 1}
early_terminate:
  type: hyperband
  max_iter: 150