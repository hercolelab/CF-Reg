method: bayes
name: 03_tuning_higgs_mlps_scfe
metric:
  goal: maximize
  name: validation/accuracy
parameters:
  tuning:
    value: true
  data.name:
    value: higgs_reduced
  preprocessor.poly_features_degree:
    value: 1
  trainer.max_epochs:
    value: 200
  model.model_type:
    value: BMLP
  model.hidden_layers:
    value: [100, 30]
  model.dropout:
    value: 0.0
  loss.type:
    value: scfe_regularization
  loss.alpha:
    distribution: uniform
    min: -1.0
    max: -0.01
  estimator.type:
    value: scfe
  estimator.reg_coef.value:
    distribution: uniform
    min: 0.1
    max: 2.3
