method: grid
name: best_higgs_reduced_mlpb_earlystopping_configurations
metric:
  goal: maximize
  name: test/accuracy
parameters:
  tuning:
    value: false
  data.name:
    value: higgs_reduced
  preprocessor.poly_features_degree:
    value: 1
  trainer.max_epochs:
    value: 200
  model.model_type:
    value: BMLP
  model.hidden_layers:
    value: [150, 1000, 150, 30]
  model.dropout:
    value: 0.0
  loss.type:
    value: normal
  trainer.callbacks:
    values:
      - {early_stop_enable: true, patience: 5}
      - {early_stop_enable: true, patience: 10}
