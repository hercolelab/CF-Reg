method: bayes
name: 01_tuning_water_lr_l1
metric:
  goal: maximize
  name: validation/accuracy
parameters:
  tuning:
    value: true
  data.name:
    value: water
  preprocessor.poly_features_degree:
    value: 6
  trainer.max_epochs:
    value: 2000
  model.model_type:
    value: LogisticRegression
  loss.type:
    value: l1normal
  loss.alpha:
    distribution: uniform
    min: 0.000001
    max: 1.0
