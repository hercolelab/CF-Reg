method: grid
name: 5_Higgs_BMLP_BIG_SCFE_TPTN # 5_Higgs_BMLP_BIG_SCFE_EpsilonVCP # 
metric:
  goal: maximize
  name: validation/accuracy
parameters:
  seed:
    values:
      - 42
      - 43
      - 44
      - 45
      - 46
  loss:
    values:
      - {type: scfe_regularization, alpha: -0.4231515950404812}
#      - {type: normal, alpha: 0.0005}
#      - {type: scfe_regularization, alpha: -0.6816607573884588}
  loss.aggr_func:
    values:
      - {type: tp_tn_mean} #  - {type: montecarlo_vcp_weighted_mean} #  
  estimator.reg_coef:
    values:
      - {rc_type: 'by_value', value: 2.1488529029721986}
  model:
    values:
  #    - {model_type: BMLP, hidden_layers: [100, 30], dropout: 0.0, single_output: True}
  #  - {model_type: BMLP, hidden_layers: [100, 40], dropout: 0.0, single_output: True}
    - {model_type: BMLP, hidden_layers: [150,1000,150, 30], dropout: 0.0, single_output: True}
  preprocessor:
    values:
      - {poly_features_degree: 1, resample: 1}