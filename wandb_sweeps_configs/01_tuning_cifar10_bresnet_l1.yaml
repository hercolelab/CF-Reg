method: bayes
name: 01_tuning_cifar10_bresnet_l1
metric:
  goal: maximize
  name: validation/accuracy
parameters:
  tuning:
    value: true
  data.name:
    value: cifar10
  trainer.max_epochs:
    value: 200
  model.model_type:
    value: BPreActResNet
  loss.type:
    value: l1normal
  loss.alpha:
    distribution: uniform
    min: 0.000001
    max: 1.0
