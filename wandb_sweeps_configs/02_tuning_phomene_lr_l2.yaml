method: bayes
name: 02_tuning_phomene_lr_l2
metric:
  goal: maximize
  name: validation/accuracy
parameters:
  tuning:
    value: true
  data.name:
    value: phomene
  preprocessor.poly_features_degree:
    value: 11
  trainer.max_epochs:
    value: 2000
  model.model_type:
    value: LogisticRegression
  loss.type:
    value: l2normal
  loss.alpha:
    distribution: uniform
    min: 0.000001
    max: 1.0
