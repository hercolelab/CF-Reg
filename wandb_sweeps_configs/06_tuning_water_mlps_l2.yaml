method: bayes
name: 06_tuning_water_mlps_l2
metric:
  goal: maximize
  name: validation/accuracy
parameters:
  tuning:
    value: true
  data.name:
    value: water
  preprocessor.poly_features_degree:
    value: 6
  trainer.max_epochs:
    value: 2000
  model.model_type:
    value: BMLP
  model.hidden_layers:
    value: [100, 30]
  model.dropout:
    value: 0.0
  loss.type:
    value: l2normal
  loss.alpha:
    distribution: uniform
    min: 0.000001
    max: 1.0
