defaults:
  - _self_
  - loader: loader
  - loss: scfe_regularization
  - model: logisticregression    # mlp - water or cnn - cifar10
  - logger: wandb
  - data: water
  - trainer: trainer_default
  - optimizer: adam
  - estimator: scfe
  - preprocessor: preprocessing

run_mode: sweep #run        
project: counterfactual_overfitting_experiments_new
name: experiments
version: 1
seed: 42
# true: fit on train, validate on validation, and do not evaluate test.
# false: normally fit on train + validation, then evaluate the holdout test.
# false + early stopping: fit on train, validate, then test the best checkpoint.
tuning: true
device: cuda